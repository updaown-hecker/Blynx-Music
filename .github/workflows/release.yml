name: Android test release

on:
  push:
    branches: [main]
    paths: ['app/build.gradle.kts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Test room links and device pairing
        run: >-
          ./gradlew :core:testDebugUnitTest
          --tests '*RoomInviteTest' --tests '*PairingCryptoTest' --tests '*RemoteLinkTest'
      - name: Build test-signed APKs
        run: ./gradlew :app:assembleDebug :tv:assembleDebug
      - name: Verify and checksum APKs
        id: apks
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release
          for abi in arm64-v8a universal; do
            apk="release/Blynx-Music-v$version-$abi.apk"
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p'
          done
          tv="release/Blynx-Music-v$version-android-tv.apk"
          cp tv/build/outputs/apk/debug/tv-debug.apk "$tv"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$tv"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$tv" | sed -n '1p'
          cd release
          sha256sum ./*.apk | sed 's/  \.\//  /' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apks.outputs.version }}
        run: |
          gh release create "v$VERSION" release/*.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Blynx Music $VERSION (test build)" \
            --prerelease --notes-file docs/test-release-notes.md
