# Generate with XcodeGen before opening the project in Xcode.
name: BlynxMusic
options:
  bundleIdPrefix: vip.blynx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  OpenTuneCore:
    path: OpenTuneCore
settings:
  base:
    MARKETING_VERSION: "1.2.9"
    CURRENT_PROJECT_VERSION: "111"
    SWIFT_VERSION: "5.0"
targets:
  BlynxMusic:
    type: application
    platform: iOS
    sources:
      - path: OpenTune
    dependencies:
      - package: OpenTuneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vip.blynx.music.ios
        PRODUCT_NAME: BlynxMusic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: OpenTune/Info.plist
      properties:
        CFBundleDisplayName: Blynx Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
