name: Blynx Music Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/blynx-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/blynx-web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @opentune/extension icons
      - run: pnpm build:site
      - uses: actions/upload-artifact@v4
        with:
          name: blynx-music-web
          path: web/app/dist/
          if-no-files-found: error
