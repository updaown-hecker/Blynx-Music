name: Blynx Music Linux release

on:
  push:
    branches: [main]
    paths: ['desktop/packaging/web/**', 'docs/blynx-linux.md', '.github/workflows/linux-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blynx-linux-release
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils rpm
      - name: Build and check Linux installers
        shell: bash
        run: |
          set -euo pipefail
          ./desktop/packaging/web/build-linux.sh release
          desktop-file-validate desktop/packaging/web/vip.blynx.music.desktop
          package=$(realpath release/*.deb)
          sudo apt-get install -y "$package"
          ./desktop/packaging/web/test-linux.sh /usr/bin/blynx-music
          mkdir -p "$RUNNER_TEMP/blynx-portable"
          tar -xzf release/*-portable.tar.gz -C "$RUNNER_TEMP/blynx-portable"
          ./desktop/packaging/web/test-linux.sh "$RUNNER_TEMP/blynx-portable/Blynx-Music/blynx-music"
          rpm -qip release/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: blynx-linux
          path: release/
      - name: Publish Linux prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat desktop/packaging/web/version.txt)
          tag="v$version-linux"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::A release for $tag already exists. Bump desktop/packaging/web/version.txt to publish new assets."
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Blynx Music $version for Linux" --notes-file docs/blynx-linux.md
