name: Android device smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'scripts/android-smoke-playback.py'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        type: string
        default: v1.0.0

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Download and verify the released APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v1.0.0' }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p qa
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-universal.apk' --pattern 'SHA256SUMS.txt' --dir qa
          cd qa
          grep '  Blynx-Music-.*-universal.apk$' SHA256SUMS.txt | sha256sum --check --strict -
      - name: Install and launch on Android 15
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'system-images;android-35;default;x86_64'
          sudo chown "$USER" /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --force --name blynx-smoke \
            --package 'system-images;android-35;default;x86_64' --device pixel_7 \
            --path "$ANDROID_AVD_HOME/blynx-smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee qa/avds.txt
          grep -Fx blynx-smoke qa/avds.txt
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd blynx-smoke -no-window \
            -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -cores 2 \
            >qa/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb_ready=0
          for attempt in {1..75}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat qa/emulator.log; exit 1; fi
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              adb_ready=1
              break
            fi
            sleep 3
          done
          [[ "$adb_ready" == 1 ]]
          # Run the application with no network and no account.
          offline=0
          for attempt in {1..12}; do
            adb shell cmd connectivity airplane-mode enable || true
            adb shell cmd wifi set-wifi-enabled disabled || true
            airplane="$(adb shell settings get global airplane_mode_on | tr -d '\r' || true)"
            wifi="$(adb shell cmd wifi status | tr -d '\r' || true)"
            if [[ "$airplane" == 1 ]] && grep -Eiq 'wi-?fi is disabled' <<< "$wifi"; then
              offline=1
              break
            fi
            sleep 2
          done
          printf 'Airplane mode: %s\n%s\n' "$airplane" "$wifi"
          [[ "$offline" == 1 ]]
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install qa/*-universal.apk
          adb logcat -c
          adb shell am start -W -a android.intent.action.MAIN \
            -c android.intent.category.LAUNCHER \
            -n vip.blynx.music/vip.blynx.music.icon.Classic | tee qa/launch.txt
          # A cold emulator can outlast am start -W's own timeout. Verify
          # the final resumed activity and retain logs even if it never appears.
          resumed=0
          for attempt in {1..16}; do
            adb shell dumpsys activity activities >qa/activities.txt
            if grep -E '(topResumedActivity|mResumedActivity).*vip.blynx.music' qa/activities.txt; then
              resumed=1
              break
            fi
            sleep 2
          done
          adb logcat -d -b crash >qa/crash.txt
          [[ "$resumed" == 1 ]]
          adb exec-out screencap -p >qa/launch.png
          timeout 230 python3 scripts/android-smoke-playback.py
          adb logcat -d -b crash >qa/crash.txt
          if grep -Fq 'Process: vip.blynx.music' qa/crash.txt; then
            cat qa/crash.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-smoke
          path: |
            qa/*.txt
            qa/*.log
            qa/*.png
            qa/*.xml
