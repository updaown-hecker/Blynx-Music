<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#100d13">
  <title>Listen Together · Blynx Music</title>
  <link rel="icon" href="/mark.svg">
  <link rel="stylesheet" href="/devices/device.css">
  <script src="/devices/device.js" defer></script>
</head>
<body data-route="together">
  <main>
    <a class="brand" href="/"><img src="/mark.svg" width="34" height="34" alt="">Blynx Music</a>
    <section class="card">
      <h1>Listen Together</h1>
      <p id="message">Open the web player to start a room or enter a room code from a friend.</p>
      <code id="code" hidden></code>
      <nav aria-label="Listen Together">
        <a id="open-app" class="action secondary" hidden>Open Android app</a>
        <a id="open-web" class="action" href="/player/#/settings/listen-together">Open web player</a>
      </nav>
    </section>
  </main>
</body>
</html>
